<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 팔공산구조팀 구조출동 기록지</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Kakao Map SDK -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
/* 전체 배경 */
body{
  background:#eef1f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  transition:background 0.3s;
}

/* 🚨 중증 점멸 */
@keyframes criticalFlash{
  0%{background-color:#fee2e2;}
  50%{background-color:#dc2626;}
  100%{background-color:#fee2e2;}
}
.critical-mode{
  animation:criticalFlash 0.8s infinite;
}

/* 카드 */
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  border-left:5px solid #2563eb;
}
.card h2{
  font-weight:700;
  font-size:15px;
  margin-bottom:10px;
  color:#1e3a8a;
}

/* 입력폼 */
input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:15px;
  background:#f9fafb;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#2563eb;
  background:#fff;
  box-shadow:0 0 0 2px rgba(37,99,235,0.15);
}
textarea{min-height:100px;}

/* 버튼 */
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
}

/* 좌표 박스 */
.coordinate-box{
  background:#e0e7ff;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:8px;
}

/* 지도 */
#map{
  width:100%;
  height:220px;
  border-radius:12px;
}

/* 기록보드 */
.board-item{
  white-space:pre-line;
  font-size:13px;
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
}

/* 헤더 */
.header{
  text-align:center;
  font-weight:800;
  font-size:20px;
  margin:18px 0;
  color:#1d4ed8;
}
</style>
</head>
<body id="mainBody">
 
<div class="container mx-auto max-w-2xl p-4">

  <h2 class="header">🚑 팔공산구조팀 출동 기록지</h2>

  <!-- 달콩이 이미지 -->
<img src="https://mudeung.github.io/rescue/logogomir1.png"
     alt="달콩이 이미지"
     style="display:block; margin:0 auto;">

<br>
  
  <form id="recordForm">   

    <!-- 현장도착 -->
    <div class="card">
      <h2>현장정보</h2>
      <input type="datetime-local" name="도착시간" required>
      <input type="text" name="사고장소" placeholder="사고장소" required>
      <input type="text" name="주증상" placeholder="환자 증상" required>

      <div id="locationDisplay" class="coordinate-box">위도: , 경도:</div>
      <button type="button" id="getLocation" class="bg-green-600 text-white">🌐 현장도착 좌표</button>
      <input type="hidden" name="사고좌표" id="hiddenCoordinate">
      <div id="map"></div>
      </div>

    <!-- 환자정보 -->
    <div class="card">
      <h2>환자정보</h2>
      <input type="text" name="환자이름" placeholder="이름" required>
      <input type="date" name="생년월일" required>
      <input type="text" name="거주지" placeholder="거주지" required>
      <input type="tel" name="연락처" placeholder="연락처 (010-1234-5678)" required>
    </div>

    <!-- 응급처치 -->
    <div class="card">
      <h2>응급처치</h2>
      <textarea name="응급처치" placeholder="응급처치 내용 AVPU/SAMPLE"></textarea>
    </div>

    <!-- 출동대원 정보 -->
    <div class="card">
      <h2>출동대원 정보</h2>
      <input type="text" name="출동대원" placeholder="출동대원 이름" required>
    </div>
    
    <button type="submit" class="bg-blue-600 text-white mt-2">기록 저장 및 공유</button>
    <p id="recordStatus"
   role="status"
   aria-live="polite"
   class="text-sm text-gray-700 mt-3">
  </p>

  </form>

  <!-- 작성 기록 -->
  <div class="card">
    <h2>작성기록</h2>
    <div id="savedData"></div>
  </div>

</div>


<script>
(() => {
  "use strict";

  let lat = null;
  let lng = null;
  let map = null;
  let marker = null;
  let isSaving = false;

  const $ = (id) => document.getElementById(id);

  function setStatus(message) {
    const el = $("recordStatus");
    if (el) el.textContent = message;
  }

  /* =========================
     1. GPS + 카카오맵
  ========================= */
  const locationButton = $("getLocation");

  if (locationButton) {
    locationButton.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("이 브라우저는 GPS 기능을 지원하지 않습니다.");
        return;
      }

      if (!window.isSecureContext) {
        alert("GPS를 사용하려면 HTTPS 환경에서 접속해야 합니다.");
        return;
      }

      locationButton.disabled = true;
      setStatus("현재 위치를 확인하고 있습니다.");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          lat = position.coords.latitude;
          lng = position.coords.longitude;

          const coordinateText =
            `위도: ${lat.toFixed(6)}, 경도: ${lng.toFixed(6)}`;

          if ($("locationDisplay")) {
            $("locationDisplay").textContent = coordinateText;
          }

          if ($("hiddenCoordinate")) {
            $("hiddenCoordinate").value = coordinateText;
          }

          // 지도 SDK와 지도 컨테이너 확인
          if (!window.kakao || !window.kakao.maps) {
            setStatus(
              "GPS 확인 완료. 카카오맵 SDK가 로드되지 않았습니다."
            );
            alert(
              "위치는 확인했지만 지도를 불러오지 못했습니다. " +
              "카카오맵 SDK와 API 키를 확인해 주세요."
            );
            locationButton.disabled = false;
            return;
          }

          const mapElement = $("map");

          if (!mapElement) {
            setStatus("지도 영역(map)을 찾을 수 없습니다.");
            locationButton.disabled = false;
            return;
          }

          

const mapPosition = new kakao.maps.LatLng(lat, lng);

try {
  if (!map) {
    map = new kakao.maps.Map(mapElement, {
      center: mapPosition,
      level: 3
    });

    marker = new kakao.maps.Marker({
      position: mapPosition,
      map: map
    });
  } else {
    map.setCenter(mapPosition);
    marker.setPosition(mapPosition);
  }

  // 지도 크기 및 위치 갱신
  map.relayout();
  map.setCenter(mapPosition);

  setStatus("현재 위치와 지도를 확인했습니다.");

} catch (error) {
  console.error("카카오맵 오류:", error);
  setStatus("GPS 좌표는 확인했지만 지도 표시 중 오류가 발생했습니다.");

} finally {
  locationButton.disabled = false;
}

},

(error) => {
  const messages = {
    1: "위치 권한이 거부되었습니다. 브라우저 설정을 확인해 주세요.",
    2: "현재 위치를 확인할 수 없습니다. GPS 설정을 확인해 주세요.",
    3: "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요."
  };

  const message =
    messages[error.code] ||
    `GPS 오류: ${error.message}`;

  setStatus(message);
  alert(message);
  locationButton.disabled = false;
},

{
  enableHighAccuracy: true,
  timeout: 20000,
  maximumAge: 0
}
);
});
}


  /* =========================
     2. 기록을 텍스트 파일로 저장
  ========================= */
  function downloadRecord(text) {
    const blob = new Blob(
      ["\uFEFF", text],
      { type: "text/plain;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "record.txt";

    document.body.appendChild(link);
    link.click();
    link.remove();

    // 다운로드 처리를 위한 여유 시간 후 URL 해제
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* =========================
     3. Android / 브라우저 공유
  ========================= */
  async function shareRecord(text) {
    // Android WebView 네이티브 브릿지 우선
    if (
      window.Android &&
      typeof window.Android.shareData === "function"
    ) {
      try {
        window.Android.shareData(text);
        return;
      } catch (error) {
        console.error("Android 공유 오류:", error);
      }
    }

    // Web Share API 지원 브라우저
    if (typeof navigator.share === "function") {
      try {
        await navigator.share({
          title: "무등산 구조 기록",
          text: text
        });
        return;
      } catch (error) {
        // 사용자가 직접 공유 창을 닫은 경우
        if (error.name === "AbortError") {
          setStatus("공유가 취소되었습니다. 기록은 화면에 남아 있습니다.");
          return;
        }

        console.error("브라우저 공유 오류:", error);
      }
    }

    // 공유를 지원하지 않는 환경에서는 파일 다운로드
    downloadRecord(text);
    setStatus("공유 기능을 사용할 수 없어 기록 파일을 다운로드했습니다.");
  }

  /* =========================
     4. Google Apps Script 전송
  ========================= */
  function sendToGoogleSheet(data) {
    const endpoint =
      "https://script.google.com/macros/s/" +
      "AKfycbxtstQehEAuNwF6ZAJskL_HWQk-UaWr5WHMPEghyuFvPzVtjWn_U_Dssk9rFCXJIkVUaw/exec";

    return fetch(endpoint, {
      method: "POST",

      // JSON 문자열을 일반 텍스트로 전송해
      // application/json의 CORS 사전 요청 문제를 피함
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(data),
      mode: "no-cors"
    });
  }

  /* =========================
     5. 기록 저장 + 공유
  ========================= */
  const form = $("recordForm");

  if (form) {
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (isSaving) return;

      isSaving = true;

      const submitButton = form.querySelector(
        'button[type="submit"], input[type="submit"]'
      );

      if (submitButton) submitButton.disabled = true;

      try {
        const data = {};

        new FormData(form).forEach((value, key) => {
          // 동일한 이름의 필드가 여러 개라면 값 보존
          if (Object.prototype.hasOwnProperty.call(data, key)) {
            if (!Array.isArray(data[key])) {
              data[key] = [data[key]];
            }
            data[key].push(value);
          } else {
            data[key] = value;
          }
        });

        const gcsElement = $("gcsResult");
        const gcs = gcsElement
          ? gcsElement.textContent.trim()
          : "";

        data.GCS = gcs;

        // 좌표를 별도 필드로도 저장
        if (lat !== null && lng !== null) {
          data.latitude = lat;
          data.longitude = lng;
        }

        // 기존 폼에 좌표 필드가 있다면 그 값도 보존
        if ($("hiddenCoordinate")) {
          data.coordinates = $("hiddenCoordinate").value;
        }

        const text = Object.entries(data)
          .map(([key, value]) => {
            const displayValue = Array.isArray(value)
              ? value.join(", ")
              : String(value ?? "");

            return `${key}: ${displayValue}`;
          })
          .join("\n");

        // 안전한 텍스트 출력: 사용자 입력을 HTML로 해석하지 않음
        const savedData = $("savedData");

        if (savedData) {
          const item = document.createElement("div");
          item.className = "board-item";
          item.textContent = text;
          savedData.prepend(item);
        }

        setStatus("기록을 화면에 저장했습니다. 시트 전송 중입니다.");

        // 공유 버튼의 사용자 동작이 유효하도록
        // 네트워크 요청을 기다리지 않고 공유를 시작
        shareRecord(text).catch((error) => {
  console.error("기록 공유 오류:", error);
  setStatus("공유 중 오류가 발생했습니다. 기록 파일을 다운로드합니다.");
  downloadRecord(text);
});

        sendToGoogleSheet(data)
          .then(() => {
            // no-cors 응답은 opaque이므로 서버 저장 성공을
            // 브라우저에서 직접 확인할 수 없음
           setStatus(
  "기록 전송 요청을 보냈습니다. " +
  "Google 스프레드시트에서 저장 여부를 확인해 주세요."
);
          })
          .catch((error) => {
            console.error("Google Sheets 전송 오류:", error);
            setStatus(
              "화면 기록은 저장했지만 시트 전송에 실패했습니다. " +
              "네트워크와 Apps Script 배포 설정을 확인해 주세요."
            );
          })
          .finally(() => {
            isSaving = false;
            if (submitButton) submitButton.disabled = false;
          });

      } catch (error) {
        console.error("기록 저장 오류:", error);
        setStatus("기록 저장 중 오류가 발생했습니다.");
        isSaving = false;
        if (submitButton) submitButton.disabled = false;
      }
    });
  }

  /* =========================
     6. 우클릭 및 단축키 제한
     보안 기능이 아닌 편의상 제한
  ========================= */
  document.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });

  document.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();

    if (
      event.key === "F12" ||
      (event.ctrlKey && key === "u") ||
      (event.ctrlKey && event.shiftKey &&
        ["i", "j", "c"].includes(key)) ||
      (event.ctrlKey && key === "s")
    ) {
      event.preventDefault();
    }
  });

})();
</script>



  
</body>
</html>
