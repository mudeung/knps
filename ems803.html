<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚑 팔공산구조팀 구조출동 기록지</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Kakao Map SDK -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>
/* 전체 배경 */
body{
  background:#eef1f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  transition:background 0.3s;
}

/* 🚨 중증 점멸 */
@keyframes criticalFlash{
  0%{background-color:#fee2e2;}
  50%{background-color:#dc2626;}
  100%{background-color:#fee2e2;}
}
.critical-mode{
  animation:criticalFlash 0.8s infinite;
}

/* 카드 */
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  border-left:5px solid #2563eb;
}
.card h2{
  font-weight:700;
  font-size:15px;
  margin-bottom:10px;
  color:#1e3a8a;
}

/* 입력폼 */
input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:15px;
  background:#f9fafb;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#2563eb;
  background:#fff;
  box-shadow:0 0 0 2px rgba(37,99,235,0.15);
}
textarea{min-height:100px;}

/* 버튼 */
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
}

/* 좌표 박스 */
.coordinate-box{
  background:#e0e7ff;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:8px;
}

/* 지도 */
#map{
  width:100%;
  height:220px;
  border-radius:12px;
}

/* 기록보드 */
.board-item{
  white-space:pre-line;
  font-size:13px;
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
}

/* 헤더 */
.header{
  text-align:center;
  font-weight:800;
  font-size:20px;
  margin:18px 0;
  color:#1d4ed8;
}
</style>
</head>
<body id="mainBody">
 
<div class="container mx-auto max-w-2xl p-4">

  <h2 class="header">🚑 팔공산구조팀 출동 기록지</h2>

  <!-- 달콩이 이미지 -->
<img src="https://mudeung.github.io/rescue/logogomir1.png"
     alt="달콩이 이미지"
     style="display:block; margin:0 auto;">

<br>
  
  <form id="recordForm">   

    <!-- 현장도착 -->
    <div class="card">
      <h2>현장정보</h2>
      <input type="datetime-local" name="도착시간" required>
      <input type="text" name="사고장소" placeholder="사고장소" required>
      <input type="text" name="주증상" placeholder="환자 증상" required>

      <div id="locationDisplay" class="coordinate-box">위도: , 경도:</div>
      <button type="button" id="getLocation" class="bg-green-600 text-white">🌐 현장도착 좌표</button>
      <input type="hidden" name="사고좌표" id="hiddenCoordinate">
      <div id="map"></div>
      </div>

    <!-- 환자정보 -->
    <div class="card">
      <h2>환자정보</h2>
      <input type="text" name="환자이름" placeholder="이름" required>
      <input type="date" name="생년월일" required>
      <input type="text" name="거주지" placeholder="거주지" required>
      <input type="tel" name="연락처" placeholder="연락처 (010-1234-5678)" required>
    </div>

    <!-- 응급처치 -->
    <div class="card">
      <h2>응급처치</h2>
      <textarea name="응급처치" placeholder="응급처치 내용 AVPU/SAMPLE"></textarea>
    </div>

    <!-- 출동대원 정보 -->
    <div class="card">
      <h2>출동대원 정보</h2>
      <input type="text" name="출동대원" placeholder="출동대원 이름" required>
    </div>
    
    <button type="submit" class="bg-blue-600 text-white mt-2">기록 저장 및 공유</button>

  </form>

  <!-- 작성 기록 -->
  <div class="card">
    <h2>작성기록</h2>
    <div id="savedData"></div>
  </div>

</div>

<script>

let lat = null;
let lng = null;


/* =========================
   GPS + 지도 (핵심 수정)
========================= */
document.getElementById("getLocation").addEventListener("click", () => {

  if (!navigator.geolocation) {
    alert("GPS를 지원하지 않는 브라우저입니다.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (p) => {

      lat = p.coords.latitude;
      lng = p.coords.longitude;

      const txt = `위도:${lat}, 경도:${lng}`;

      document.getElementById("locationDisplay").textContent = txt;
      document.getElementById("hiddenCoordinate").value = txt;

      if (window.kakao && kakao.maps) {

        const loc = new kakao.maps.LatLng(lat, lng);

        const map = new kakao.maps.Map(
          document.getElementById("map"),
          {
            center: loc,
            level: 3
          }
        );

        new kakao.maps.Marker({
          position: loc,
          map: map
        });
      }

    },
    (err) => {
      alert("GPS 실패: " + err.message);
    }
  );
});

/* =========================
   Android 공유 브릿지
========================= */
function shareToApp(text) {

  if (window.Android && Android.shareData) {
    Android.shareData(text);
    return;
  }

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "record.txt";
  a.click();

  URL.revokeObjectURL(url);
}

/* =========================
   기록 저장 + 공유
========================= */
document.getElementById("recordForm").addEventListener("submit", (e) => {

  e.preventDefault();

  let data = {};
  let text = "";

  new FormData(e.target).forEach((v,k) => {
    data[k] = v;
    text += `${k}: ${v}\n`;
  });

  const gcs = document.getElementById("gcsResult").textContent;
  data["GCS"] = gcs;
  text += `GCS: ${gcs}`;

  document.getElementById("savedData").innerHTML =
    `<div class="board-item">${text}</div>`;

  /* Google Sheet 전송 */
  fetch("https://script.google.com/macros/s/AKfycbxtstQehEAuNwF6ZAJskL_HWQk-UaWr5WHMPEghyuFvPzVtjWn_U_Dssk9rFCXJIkVUaw/exec", {
    method: "POST",
    body: JSON.stringify(data)
  }).catch(() => {});

  /* 공유 (핵심 수정) */
  const isAndroid = /Android/i.test(navigator.userAgent);

  if (window.Android && Android.shareData) {
    Android.shareData(text);
  }

  else if (navigator.share && !isAndroid) {
    navigator.share({
      title: "무등산 구조 기록",
      text: text
    });
  }

  else {
    shareToApp(text);
  }

});

</script>

<script>
/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }

    // Ctrl + U (페이지 소스 보기)
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + J (콘솔)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + C (요소 선택)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }

    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
});
</script>


  
</body>
</html>
