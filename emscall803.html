<!DOCTYPE html>
<html lang="ko">

<meta

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>

.elapsed{

@media(max-width:600px){

        font-size:18px;

</style>

</head>

<body>

<header>
    🆘 팔공산 산악구조팀 사고공유
</header>

<audio id="alertSound" preload="auto">
    <source
        src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
        type="audio/ogg"
    >
</audio>

<div class="container">
    <div id="map"></div>
</div>

<img
    id="dogImage"
    src="https://mudeung.github.io/rescue/logogomir1.png"
    alt="달콩이 이미지"
>

<div class="container">

    <div id="listArea">
        로딩중...
    </div>

</div>

<script>

/* =====================================================
   기본 설정
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwY0Z_EZw5qHZsrAX7jFHzx5Q43wi9O0wJfh6EgceptwOMo6x0VbXXhJYelAQlEgrXc/exec";
     
let map = null;

let markers = [];

let openedInfoWindow = null;

let openedMarker = null;

let knownIds = new Set();

let alertedOverdueIds = new Set();

let overdueIntervals = new Map();

let firstLoad = true;

let loading = false;

const listArea =
    document.getElementById("listArea");

const alertSound =
    document.getElementById("alertSound");


/* =====================================================
   지도 초기화
===================================================== */

function initMap(){

    try{

        map = new kakao.maps.Map(

            document.getElementById("map"),

            {
                center:
                    new kakao.maps.LatLng(
                        36.016537,
                        128.695323
                    ),

                level:6
            }

        );

    }

    catch(error){

        console.error(error);

        document.getElementById("map").innerHTML =
            '<div style="padding:20px;color:#ff9999;">지도 초기화 실패</div>';

    }

}

initMap();


/* =====================================================
   HTML 안전 처리
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   날짜 처리
===================================================== */

function parseDate(value){

    if(
        !value
    ){

        return null;

    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return null;

    }

    return date;

}


/* =====================================================
   날짜 표시
===================================================== */

function formatDate(value){

    const date =
        parseDate(value);

    if(!date){

        return "";

    }

    return date.toLocaleString(
        "ko-KR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


/* =====================================================
   경과시간
===================================================== */

function getElapsedTime(
    startTime,
    endTime = null
){

    const start =
        parseDate(startTime);

    if(!start){

        return "시간 정보 없음";

    }

    const end =
        endTime
        ? parseDate(endTime)
        : new Date();

    if(!end){

        return "시간 정보 없음";

    }

    const diff =
        Math.max(
            0,
            Math.floor(
                (end - start) / 1000
            )
        );

    const h =
        Math.floor(diff / 3600);

    const m =
        Math.floor(
            (diff % 3600) / 60
        );

    const s =
        diff % 60;

    if(h > 0){

        return `${h}시간 ${m}분 ${s}초 경과`;

    }

    return `${m}분 ${s}초 경과`;

}


/* =====================================================
   상태 색상
===================================================== */

function getMarkerColor(status){

    if(
        status === "사고처리완료"
    ){

        return "#777777";

    }

    if(
        status === "현장도착"
    ){

        return "#fb8c00";

    }

    return "#e53935";

}


/* =====================================================
   마커 이미지
===================================================== */

function createMarkerImage(status){

    const color =
        getMarkerColor(status);

    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="44"
            height="44"
            viewBox="0 0 44 44"
        >

            <circle
                cx="22"
                cy="22"
                r="19"
                fill="${color}"
                stroke="#ffffff"
                stroke-width="3"
            />

            <circle
                cx="22"
                cy="22"
                r="7"
                fill="#ffffff"
            />

        </svg>

    `;

    return new kakao.maps.MarkerImage(

        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg),

        new kakao.maps.Size(
            44,
            44
        ),

        {
            offset:
                new kakao.maps.Point(
                    22,
                    22
                )
        }

    );

}


/* =====================================================
   팝업
===================================================== */

function createInfoWindow(
    item,
    lat,
    lng
){

    let statusColor =
        "#e53935";

    let statusText =
        "🔴 사고 접수";

    if(
        item.status === "현장도착"
    ){

        statusColor =
            "#fb8c00";

        statusText =
            "🟠 현장도착";

    }

    if(
        item.status === "사고처리완료"
    ){

        statusColor =
            "#777";

        statusText =
            "⚪ 사고처리완료";

    }

    const safeType =
        escapeHTML(
            item.type || "미입력"
        );

    const safeSymptom =
        escapeHTML(
            item.symptom || "내용없음"
        );

    const safeAddress =
        escapeHTML(
            item.address || "주소없음"
        );

    const safePhone =
        escapeHTML(
            item.phone || "번호없음"
        );

    const infoContent = `

        <div
            style="
                padding:12px;
                color:#222;
                font-family:Arial,sans-serif;
                font-size:13px;
                min-width:250px;
                max-width:310px;
                line-height:1.5;
            "
        >

            <div
                style="
                    font-size:16px;
                    font-weight:bold;
                    margin-bottom:8px;
                "
            >
                🆘 산악사고 신고
            </div>

            <div
                style="
                    display:inline-block;
                    padding:5px 10px;
                    background:${statusColor};
                    color:#fff;
                    border-radius:5px;
                    font-weight:bold;
                    margin-bottom:8px;
                "
            >
                ${statusText}
            </div>

            <br>

            🚨 <b>신고유형</b><br>
            ${safeType}

            <br><br>

            🕒 <b>접수시간</b><br>
            ${formatDate(item.time)}

            <br><br>

            ⏱ <b>경과시간</b><br>
            ${getElapsedTime(
                item.time,
                item.finishTime
            )}

            <br><br>

            📝 <b>상황</b><br>

            <div
                style="
                    margin-top:5px;
                    padding:7px;
                    background:#f3f3f3;
                    border-radius:4px;
                    white-space:pre-wrap;
                    word-break:break-word;
                "
            >
                ${safeSymptom}
            </div>

            <br>

            🏠 <b>주소</b><br>
            ${safeAddress}

            <br><br>

            📞 <b>연락처</b><br>
            ${safePhone}

            <br><br>

            📍 <b>좌표</b><br>
            ${lat.toFixed(6)},
            ${lng.toFixed(6)}

            ${
                item.completeTime
                ?
                `
                <br><br>
                🚑 <b>현장도착</b><br>
                ${formatDate(item.completeTime)}
                `
                :
                ""
            }

            ${
                item.finishTime
                ?
                `
                <br><br>
                ⚪ <b>사고처리 완료</b><br>
                ${formatDate(item.finishTime)}
                `
                :
                ""
            }

            <div
                style="margin-top:12px;"
            >

                <a
                    href="https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}"
                    target="_blank"
                    style="
                        color:#1976d2;
                        text-decoration:none;
                        font-weight:bold;
                    "
                >
                    📍 카카오맵에서 보기
                </a>

            </div>

        </div>

    `;

    return new kakao.maps.InfoWindow({

        content:
            infoContent,

        removable:true

    });

}


/* =====================================================
   경보 중지
===================================================== */

function stopOverdueAlert(id){

    if(
        overdueIntervals.has(id)
    ){

        clearInterval(
            overdueIntervals.get(id)
        );

        overdueIntervals.delete(id);

    }

}


/* =====================================================
   3분 초과 응급환자
===================================================== */

function checkOverdue(
    item,
    div
){

    if(
        item.type !== "응급환자"
    ){

        return;

    }

    if(
        item.status === "사고처리완료"
    ){

        stopOverdueAlert(item.id);

        return;

    }

    const start =
        parseDate(item.time);

    if(!start){

        return;

    }

    const diffSeconds =
        Math.floor(
            (new Date() - start) / 1000
        );

    if(
        diffSeconds < 180
    ){

        return;

    }

    div.classList.add("blink");

    if(
        alertedOverdueIds.has(item.id)
    ){

        return;

    }

    alertedOverdueIds.add(item.id);

    playAlert();

    const interval =
        setInterval(

            () => {

                if(
                    div.classList.contains("done")
                ){

                    stopOverdueAlert(
                        item.id
                    );

                    return;

                }

                playAlert();

            },

            30000

        );

    overdueIntervals.set(
        item.id,
        interval
    );

}


/* =====================================================
   알림음
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();

        if(
            promise &&
            promise.catch
        ){

            promise.catch(
                () => {}
            );

        }

    }

    catch(error){

        console.log(
            "알림음 재생 제한:",
            error
        );

    }

}


/* =====================================================
   현장도착
===================================================== */

async function completeCase(id){

    if(
        !confirm(
            "구조대원이 현장에 도착했습니까?"
        )
    ){

        return;

    }

    await updateCase(
        "complete",
        id
    );

}


/* =====================================================
   사고처리 완료
===================================================== */

async function finishCase(id){

    if(
        !confirm(
            "사고처리를 완료하시겠습니까?"
        )
    ){

        return;

    }

    await updateCase(
        "finish",
        id
    );

}


/* =====================================================
   상태 변경 공통
===================================================== */

async function updateCase(
    action,
    id
){

    try{

        const response =
            await fetch(

                API_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({
                            action:action,
                            id:String(id)
                        })

                }

            );

        const result =
            await response.json();

        if(
            result.result !== "success"
        ){

            alert(
                result.message ||
                "처리 실패"
            );

            return;

        }

        await loadData();

    }

    catch(error){

        console.error(error);

        alert(
            "서버와 통신하는 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================
   마커 삭제
===================================================== */

function clearMarkers(){

    markers.forEach(
        marker => {
            marker.setMap(null);
        }
    );

    markers = [];

    if(
        openedInfoWindow
    ){

        openedInfoWindow.close();

    }

    openedInfoWindow = null;

    openedMarker = null;

}


/* =====================================================
   신고 목록
===================================================== */

async function loadData(){

    if(loading){

        return;

    }

    loading = true;

    try{

        const response =
            await fetch(
                API_URL +
                "?action=list&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "서버 응답이 배열이 아닙니다."
            );

        }

        clearMarkers();

        listArea.innerHTML = "";

        if(
            data.length === 0
        ){

            listArea.innerHTML =
                `
                <div class="empty">
                    현재 접수된 신고가 없습니다.
                </div>
                `;

            firstLoad = false;

            return;

        }


        /* =============================================
           신규 신고 확인
        ============================================= */

        if(firstLoad){

            data.forEach(
                item => {

                    if(item.id){
                        knownIds.add(
                            String(item.id)
                        );
                    }

                }
            );

            firstLoad = false;

        }

        else{

            let newReport = false;

            data.forEach(
                item => {

                    const id =
                        String(item.id || "");

                    if(
                        id &&
                        !knownIds.has(id)
                    ){

                        knownIds.add(id);

                        newReport = true;

                    }

                }
            );

            if(newReport){

                alert(
                    "🚨 새로운 산악사고 신고가 접수되었습니다!"
                );

                playAlert();

            }

        }


        /* =============================================
           최신 신고순
        ============================================= */

        data.sort(

            (a,b) => {

                const da =
                    parseDate(a.time);

                const db =
                    parseDate(b.time);

                if(!da) return 1;

                if(!db) return -1;

                return db - da;

            }

        );


        /* =============================================
           카드
        ============================================= */

        data.forEach(
            item => {

                const id =
                    String(item.id || "");

                const div =
                    document.createElement("div");

                div.className =
                    "card";

                if(
                    item.status ===
                    "사고처리완료"
                ){

                    div.classList.add("done");

                }

                div.dataset.time =
                    item.time || "";

                div.dataset.finishTime =
                    item.finishTime || "";


                /* =====================================
                   상태
                ===================================== */

                let statusHTML = "";

                if(
                    item.status ===
                    "사고처리완료"
                ){

                    statusHTML = `
                        <div class="status done">
                            ⚪ 사고처리완료
                        </div>
                    `;

                }

                else if(
                    item.status ===
                    "현장도착"
                ){

                    statusHTML = `
                        <div class="status arrived">
                            🟠 현장도착
                        </div>
                    `;

                }

                else{

                    statusHTML = `
                        <div class="status received">
                            🔴 사고 접수
                        </div>
                    `;

                }


                /* =====================================
                   현장도착 시간
                ===================================== */

                let completeHTML = "";

                if(
                    item.completeTime
                ){

                    completeHTML = `
                        <div class="time">
                            🚑 현장도착:
                            ${escapeHTML(
                                formatDate(
                                    item.completeTime
                                )
                            )}
                        </div>
                    `;

                }


                /* =====================================
                   완료 시간
                ===================================== */

                let finishHTML = "";

                if(
                    item.finishTime
                ){

                    finishHTML = `
                        <div class="time">
                            ✅ 사고처리 완료:
                            ${escapeHTML(
                                formatDate(
                                    item.finishTime
                                )
                            )}
                        </div>
                    `;

                }


                /* =====================================
                   버튼
                ===================================== */

                let buttonHTML = "";

                if(
                    item.status ===
                    "사고처리완료"
                ){

                    buttonHTML = `
                        <span style="
                            display:inline-block;
                            margin-top:10px;
                            color:#aaa;
                            font-weight:bold;
                        ">
                            ✔ 처리완료
                        </span>
                    `;

                    stopOverdueAlert(id);

                }

                else if(
                    item.status ===
                    "현장도착"
                ){

                    buttonHTML = `
                        <button
                            class="complete-btn finish"
                            onclick="finishCase('${escapeHTML(id)}')"
                        >
                            ✅ 사고처리 완료
                        </button>
                    `;

                }

                else{

                    buttonHTML = `
                        <button
                            class="complete-btn"
                            onclick="completeCase('${escapeHTML(id)}')"
                        >
                            🚑 구조대원 현장도착
                        </button>
                    `;

                }


                /* =====================================
                   카드 내용
                ===================================== */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:
                        ${escapeHTML(
                            formatDate(item.time)
                        )}

                    </div>

                    <div class="time elapsed">

                        ⏱
                        ${escapeHTML(
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        )}

                    </div>

                    ${statusHTML}

                    ${completeHTML}

                    ${finishHTML}

                    <div class="type">

                        🚨
                        ${escapeHTML(
                            item.type || "미입력"
                        )}

                    </div>


                    <div class="info-box">

                        🏠 <b>주소</b>

                        <div style="margin-top:4px;">
                            ${escapeHTML(
                                item.address || "주소없음"
                            )}
                        </div>

                    </div>


                    <div class="info-box">

                        📞 <b>연락처</b>

                        <div style="margin-top:4px;">
                            ${escapeHTML(
                                item.phone || "번호없음"
                            )}
                        </div>

                    </div>


                    <div class="info-box">

                        📝 <b>신고 내용</b>

                        <div class="symptom">

                            ${escapeHTML(
                                item.symptom || "내용없음"
                            )}

                        </div>

                    </div>


                    <div class="coord">

                        위도:
                        ${escapeHTML(item.lat)}

                        /

                        경도:
                        ${escapeHTML(item.lng)}

                    </div>


                    <a
                        class="maplink"
                        href="https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}"
                        target="_blank"
                    >
                        📍 지도보기
                    </a>

                    <br>

                    ${buttonHTML}

                `;


                listArea.appendChild(div);


                /* =====================================
                   3분 초과 확인
                ===================================== */

                checkOverdue(
                    item,
                    div
                );


                /* =====================================
                   지도 마커
                ===================================== */

                const lat =
                    Number(item.lat);

                const lng =
                    Number(item.lng);

                if(
                    map &&
                    Number.isFinite(lat) &&
                    Number.isFinite(lng)
                ){

                    const position =
                        new kakao.maps.LatLng(
                            lat,
                            lng
                        );

                    const marker =
                        new kakao.maps.Marker({

                            map:map,

                            position:position,

                            title:
                                item.type ||
                                "산악사고 신고",

                            image:
                                createMarkerImage(
                                    item.status
                                )

                        });

                    markers.push(marker);


                    const infoWindow =
                        createInfoWindow(
                            item,
                            lat,
                            lng
                        );


                    kakao.maps.event.addListener(

                        marker,

                        "click",

                        function(){

                            if(
                                openedMarker ===
                                marker
                            ){

                                if(
                                    openedInfoWindow
                                ){

                                    openedInfoWindow.close();

                                }

                                openedInfoWindow = null;

                                openedMarker = null;

                                return;

                            }


                            if(
                                openedInfoWindow
                            ){

                                openedInfoWindow.close();

                            }


                            infoWindow.open(
                                map,
                                marker
                            );

                            openedInfoWindow =
                                infoWindow;

                            openedMarker =
                                marker;

                        }

                    );

                }

            }
        );


        /* =============================================
           모든 마커가 보이도록
        ============================================= */

        if(
            markers.length > 0 &&
            map
        ){

            const bounds =
                new kakao.maps.LatLngBounds();

            markers.forEach(
                marker => {

                    bounds.extend(
                        marker.getPosition()
                    );

                }
            );

            map.setBounds(
                bounds
            );

        }

    }

    catch(error){

        console.error(
            "loadData 오류:",
            error
        );

        listArea.innerHTML = `

            <div class="error">

                ⚠ 신고목록을 불러오지 못했습니다.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                잠시 후 자동으로 다시 시도합니다.

            </div>

        `;

    }

    finally{

        loading = false;

    }

}


/* =====================================================
   최초 실행
===================================================== */

loadData();


/* =====================================================
   10초마다 신고목록 갱신
===================================================== */

setInterval(
    loadData,
    10000
);


/* =====================================================
   경과시간 1초 갱신
===================================================== */

setInterval(

    () => {

        document
            .querySelectorAll(".card")
            .forEach(card => {

                const elapsedEl =
                    card.querySelector(
                        ".elapsed"
                    );

                if(!elapsedEl){

                    return;

                }

                const startTime =
                    card.dataset.time;

                const finishTime =
                    card.dataset.finishTime;

                elapsedEl.innerText =
                    "⏱ " +
                    getElapsedTime(
                        startTime,
                        finishTime
                    );

            });

    },

    1000
);


/* =====================================================
   우클릭 방지
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);


/* =====================================================
   개발자도구 단축키 방지
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "F12"){

            e.preventDefault();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

        }

        if(
            e.ctrlKey &&
            e.shiftKey &&
            ["i","j","c"].includes(
                e.key.toLowerCase()
            )
        ){

            e.preventDefault();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

        }

    }
);

</script>
