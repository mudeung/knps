<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🗽 팔공산 구조대</title>

<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">   

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* 암호 확인 전 본문 숨김 */
body:not(.password-verified):not(.link-expired) > :not(#passwordPanel):not(#expiredPanel) {
  visibility: hidden;
}

/* 암호 입력창 */
.password-panel {
  width: min(420px, calc(100% - 32px));
  max-width: 420px;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  color: #20242a;
  box-shadow: 0 18px 60px #00000025;
}

.password-panel::backdrop {
  background: #111827cc;
  backdrop-filter: blur(3px);
}

.password-panel h2 {
  margin: 0 0 10px;
  color: #20242a;
  font-size: 22px;
  text-align: left;
}

.password-panel > p {
  color: var(--muted);
  line-height: 1.6;
  text-align: left;
}

/* 암호 입력과 확인 버튼 한 줄 배치 */
.password-input-row {
  display: flex;
  align-items: stretch;
  gap: 10px;
  width: 100%;
  margin-top: 20px;
}

.password-input-row input {
  flex: 1;
  width: 0;
  min-width: 0;
  height: 46px;
  padding: 0 12px;
  border: 1px solid #aeb5be;
  border-radius: 10px;
  background: #fff;
  color: #20242a;
  font: inherit;
}

.password-input-row .button {
  flex: 0 0 82px;
  width: 82px;
  height: 46px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

#passwordStatus {
  min-height: 24px;
  margin: 8px 0 0;
  color: var(--primary);
  font-size: 14px;
  text-align: left;
}

.password-input-row input:focus-visible,
.password-input-row button:focus-visible {
  outline: 3px solid #1769aa;
  outline-offset: 3px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html, body{
    width:100%;
    overflow-x:hidden;
    background:#e9e9e9;
}

body{
    width:100%;
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    padding-top: env(safe-area-inset-top);
}

/* ================= 상단 헤더 ================= */

.header{

    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('https://mudeung.github.io/knps/80san.jpg');

    background-size:cover;
    background-position:center;

    height:210px;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;

    box-shadow:0 4px 14px rgba(0,0,0,0.15);
}

/* ================= 로고 ================= */

.logo{

    width:72px;
    height:72px;

    border-radius:50%;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:14px;

    animation:pulse 1.5s infinite;
}

.sos{

    color:#e53935;

    font-size:26px;
    font-weight:900;

    letter-spacing:2px;
}

@keyframes pulse{

    0%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(229,57,53,0.6);
    }

    70%{
        transform:scale(1.05);
        box-shadow:0 0 0 16px rgba(229,57,53,0);
    }

    100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(229,57,53,0);
    }
}

/* ================= 제목 ================= */

.title{

    font-size:24px;
    font-weight:700;

    text-align:center;

    line-height:1.3;
}

.subtitle{

    margin-top:8px;

    font-size:13px;

    opacity:0.92;
}

/* ================= 전체 아이콘 메뉴 ================= */

.icon-grid{
    padding:20px 16px 40px;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap:14px;
}

/* ================= 아이콘 카드 ================= */

.icon-card{
    padding:10px;
    background:white;
    border-radius:20px;

    min-height:100px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;

    text-align:center;

    cursor:pointer;

    box-shadow:0 4px 14px rgba(0,0,0,0.08);

    transition:0.2s;

    width:100%;
    overflow:hidden;
}

/* ================= 아이콘 ================= */

.icon{

    font-size:32px;
}

.logo19_192-image{
    width:120px;
    height:auto;
    display:block;
    margin:10px auto;
}

.logogomir1-image{
    width:120px;
    height:auto;
    display:block;
    margin:10px auto;
}

    
/* ================= 텍스트 ================= */

.icon-text{
    font-size:13px;
    font-weight:700;
    color:#222;
    line-height:1.4;

    word-break:keep-all;
    white-space:normal;
}

/* ================= 강조 카드 ================= */

.primary{
    background:#1e88e5;
    color:white;
}

.primary .icon-text{
    color:white;
}

/* ================= 작은 화면 ================= */

@media(max-width:360px){

    .title{
        font-size:21px;
    }

    .icon-text{
        font-size:11px;
    }

    .icon{
        font-size:28px;
    }

}

</style>
</head>

<body>

<!-- =========================================
     암호 입력창
========================================= -->
<dialog id="passwordPanel"
        class="password-panel"
        aria-labelledby="passwordHeading"
        aria-describedby="passwordDescription">

  <h2 id="passwordHeading">암호 입력</h2>

  <p id="passwordDescription">
    접속하려면 접속 암호를 입력하세요.
  </p>

  <form id="passwordForm">
    <div class="password-input-row">

      <input
        id="accessPassword"
        name="accessPassword"
        type="password"
        placeholder="접속 암호"
        autocomplete="current-password"
        maxlength="128"
        required
      >

      <button type="submit" class="button">
        확인
      </button>

    </div>

    <p id="passwordStatus"
       role="status"
       aria-live="polite"></p>
  </form>
</dialog>


<!-- ================= 헤더 ================= -->

<div class="header">

    <div class="logo">
        <span class="sos">SOS</span>
    </div>

    <div class="title">
        팔공산 구조대
    </div>

    <div class="subtitle">
        팔공산산악구조대
    </div>

</div>

<!-- ================= 아이콘 메뉴 ================= -->

<div class="icon-grid">
    
   <!-- 산악구조 문자 -->
    <div class="icon-card"
   onclick="location.href='https://mudeung.github.io/knps/gpscall803.html'">
        <div class="icon">📞</div>

        <div class="icon-text">
           산악구조 문자
        </div>

    </div>
    
    <!-- 산악구조 링크 -->
    <div class="icon-card"
    onclick="location.href='https://mudeung.github.io/knps/gps803.html'">
        <div class="icon">📍</div>

        <div class="icon-text">
            위치공유 링크
        </div>

    </div>

    <!-- 요구조자 위치목록 -->
    <div class="icon-card"
    onclick="location.href='https://mudeung.github.io/knps/emscall803.html'">

        <div class="icon">🖥️</div>

        <div class="icon-text">
            요구조자 위치공유
        </div>

    </div>

   <!-- 산악사고 입력 -->
    <div class="icon-card"
   onclick="location.href='https://mudeung.github.io/knps/callems803.html'">

        <div class="icon">🚑</div>

        <div class="icon-text">
            산악사고 접수
        </div>

    </div>   

  <!-- 산악사고 기록 -->
    <div class="icon-card"
    onclick="location.href='https://mudeung.github.io/knps/ems803.html'">

        <div class="icon">📝</div>

        <div class="icon-text">
            산악사고 기록
        </div>
   
    </div>   

 <!-- 사고지점 좌표확인 -->
    <div class="icon-card"
    onclick="location.href='https://mudeung.github.io/knps/rescuer803.html'">

        <div class="icon">🌐</div>

        <div class="icon-text">
            사고지점 좌표확인
        </div>
        
        </div>
    
    <!-- 현재위치 좌표 -->
    <div class="icon-card"
   onclick="location.href='https://mudeung.github.io/knps/gpsxyz803.html'">
        <div class="icon">📡</div>

        <div class="icon-text">
            현재위치 좌표 
        </div>

    </div> 
  

    <!-- 수색위치 공유 -->
    <div class="icon-card"
   onclick="location.href='https://mudeung.github.io/knps/searchs803.html'">
        <div class="icon">🛰</div>

        <div class="icon-text">
            수색위치 공유 
        </div>

    </div>

<script>
    
/* =========================================
   링크 만료 확인 및 화면 처리
========================================= */
(function () {
  if (!window.MUDEUNG_LINK_EXPIRED) {
    return;
  }

  // 만료된 경우 암호 입력창을 열지 않음
  document.body.classList.add("link-expired");

  const panel = document.getElementById("passwordPanel");
  const expiredPanel = document.getElementById("expiredPanel");

  if (panel) {
    panel.remove();
  }

  if (expiredPanel) {
    expiredPanel.style.display = "block";
  }
})();

/* =========================================
   암호 확인
========================================= */
(function () {
  // 만료된 링크는 암호 확인 절차를 실행하지 않음
  if (window.MUDEUNG_LINK_EXPIRED) {
    return;
  }

  const PASSWORD = "knps";

  const panel = document.getElementById("passwordPanel");
  const form = document.getElementById("passwordForm");
  const input = document.getElementById("accessPassword");
  const status = document.getElementById("passwordStatus");

  // 암호창 표시
  panel.showModal();
  input.focus();

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    if (input.value === PASSWORD) {
      document.body.classList.add("password-verified");

      panel.close();
      input.value = "";
      status.textContent = "";
    } else {
      status.textContent = "암호가 올바르지 않습니다.";
      input.value = "";
      input.focus();
    }
  });

  // ESC로 암호창 닫기 방지
  panel.addEventListener("cancel", function (event) {
    event.preventDefault();
  });
})();
    
/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }

    // Ctrl + U (페이지 소스 보기)
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + J (콘솔)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + C (요소 선택)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }

    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
});
</script>
    
    
</body>
</html>
